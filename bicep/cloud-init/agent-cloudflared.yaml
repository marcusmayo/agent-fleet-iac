#cloud-config
# Converged agent base (Castor/Keel) with Cloudflare Tunnel transport.
# Placeholders (double-underscore tokens) are injected by vm.bicep at deploy
# time. The tunnel token is the ONLY secret in customData and is scrubbed from
# cloud logs after cloudflared installs. Runtime secrets (TOTP, model API key)
# are injected later via bootstrap over SSH — never in this file.
package_update: true
packages: [docker.io, docker-compose-v2, git, python3-qrcode, curl]
runcmd:
  - set -e
  # --- Cloudflare Tunnel (outbound-only; no inbound ports required) ---
  - install -m 0755 -d /usr/share/keyrings
  - curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg -o /usr/share/keyrings/cloudflare-main.gpg
  - echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared noble main' > /etc/apt/sources.list.d/cloudflared.list
  - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y cloudflared
  - cloudflared service install '__CF_TUNNEL_TOKEN__'
  - grep -rl 'eyJ' /var/lib/cloud/ 2>/dev/null | xargs -r sed -i 's/eyJ[A-Za-z0-9._-]\{16,\}/CF-TOKEN-SCRUBBED/g'
  # --- Container runtime + agent image (hash-pinned build, per repo) ---
  - systemctl enable --now docker
  - usermod -aG docker __ADMIN_USER__
  - git clone '__REPO_URL__' /home/__ADMIN_USER__/agent
  - 'if [ -n "__REPO_REF__" ]; then git -C /home/__ADMIN_USER__/agent checkout --quiet "__REPO_REF__" || { echo "ABORT: repoRef __REPO_REF__ did not resolve" | tee /var/log/agent-image-build.log; exit 1; }; fi'
  - 'git -C /home/__ADMIN_USER__/agent rev-parse HEAD | tee /var/log/agent-built-sha.log'
  # Agent root: keel-style repos put infra/ at the clone root; Castor keeps it under
  # scaffold/. Detect and use the right dir (safe no-op for keel — no scaffold/).
  - 'if [ -d "/home/__ADMIN_USER__/agent/scaffold" ]; then AGENT_DIR="/home/__ADMIN_USER__/agent/scaffold"; else AGENT_DIR="/home/__ADMIN_USER__/agent"; fi; echo "agent dir: $AGENT_DIR"'
  - printf 'AGENT_PROFILE=%s\nKEY_VAULT_NAME=%s\nMSI_CLIENT_ID=%s\n' '__AGENT_PROFILE__' '__KEY_VAULT_NAME__' '__MSI_CLIENT_ID__' > "$AGENT_DIR/.provision-flags"
  # Brand this agent with its deploy-time name. The shared webchat reads agent_name
  # from system/agent.yaml; overwrite the repo default with __AGENT_NAME__, then
  # verify loudly (fail the build rather than ship a mis-branded agent).
  - 'sed -i "s/^agent_name:.*/agent_name: \"__AGENT_NAME__\"/" "$AGENT_DIR/system/agent.yaml"'
  - 'grep -qx "agent_name: \"__AGENT_NAME__\"" "$AGENT_DIR/system/agent.yaml" || { echo "ABORT: agent_name not branded to __AGENT_NAME__" | tee -a /var/log/agent-image-build.log; exit 1; }'
  # chown BEFORE the build so the tree is admin-owned even if the build fails, and
  # invoke the builder via bash so a missing +x bit on build-image.sh cannot
  # Permission-deny and abort the whole runcmd (set -e). build-image.sh writes no
  # repo files (docker build only), so chown-before is complete.
  - chown -R __ADMIN_USER__:__ADMIN_USER__ /home/__ADMIN_USER__/agent
  # build-image.sh tags the image from `git rev-parse` and runs here as root, but the
  # tree is now admin-owned — git's ownership-safety check would refuse and fail the
  # unattended build (works by hand only because the operator IS the admin user).
  # Grant root an exception for this one repo so cloud-init builds without a human.
  - git config --global --add safe.directory /home/__ADMIN_USER__/agent
  - cd "$AGENT_DIR" && bash ./infra/scripts/build-image.sh > /var/log/agent-image-build.log 2>&1
  - "{ dpkg-query -W docker.io docker-compose-v2 git cloudflared; } > /var/log/agent-provision-versions.log 2>&1"
final_message: "agent (__AGENT_PROFILE__) cloud-init complete after $UPTIME s -- next: SSH in, run infra/scripts/bootstrap.sh, then reach the webchat via its Cloudflare hostname"
